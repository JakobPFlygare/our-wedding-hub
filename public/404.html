<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pau &amp; Jakob Wedding</title>
    <script>
      // SPA fallback for GitHub Pages (single-page app on a custom domain).
      // GitHub serves this 404.html for any unknown path. We encode the
      // requested path into a query string and redirect to the site root,
      // where a matching snippet in index.html restores the real URL so
      // React Router can handle it. Adapted from rafgraph/spa-github-pages.
      (function () {
        var pathSegmentsToKeep = 0; // custom apex domain -> keep no segments
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
