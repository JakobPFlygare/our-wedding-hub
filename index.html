    <!-- Restore the real URL after a GitHub Pages 404.html SPA redirect.
         Must run before the app so React Router sees the correct path.
         Adapted from rafgraph/spa-github-pages. -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>
